<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Terra da Esperança</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      height: 100vh;
      display: flex;
    }

    .left {
      flex: 0 0 58.33%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px;
    }

    .form-wrap {
      width: 100%;
      max-width: 450px;
    }

    .title-app {
      font-size: 2.5rem;
      font-weight: 300;
      margin-bottom: 20px;
    }

    .title-form {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    .field input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .btn-cadastro {
      width: 100%;
      padding: 14px;
      background-color: #2d5a27;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-cadastro:hover {
      background-color: #3d7a35;
    }

    .footer-text {
      text-align: center;
      margin-top: 15px;
    }

    .footer-text a {
      color: #2d5a27;
      text-decoration: none;
      font-weight: bold;
    }

    .right {
      flex: 1;
      min-height: 100vh;
      background: linear-gradient(145deg, #2d5a27 0%, #3d7a35 50%, #4e9444 100%);
      background-image: url('terradaesperanca.jpeg');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body>

  <div class="left">
    <div class="form-wrap">

      <h1 class="title-app">Terra da Esperança</h1>

      <h2 class="title-form">Criar nova conta</h2>

      <div class="field">
        <label>Nome Completo</label>
        <input type="text" id="nome" placeholder="Digite seu nome completo" />
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="Coloque seu Email" />
      </div>

      <div class="field">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" />
      </div>

      <div class="field">
        <label>Confirmar Senha</label>
        <input type="password" id="confirmarSenha" placeholder="Confirme sua senha" />
      </div>

      <button class="btn-cadastro" onclick="cadastrar()">
        Cadastrar
      </button>

      <p class="footer-text">
        Já possui conta?
        <a href="TerraDaEsperanca.html">Entrar</a>
      </p>

    </div>
  </div>

  <div class="right"></div>

  <script>
    function cadastrar() {
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;

      alert('Cadastro realizado com sucesso!');

      console.log('Nome:', nome);
      console.log('Email:', email);
    }
  </script>

</body>
</html>
