<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ── Coluna esquerda ── */
    .left {
      flex: 0 0 58.33%; /* md="7" → 7/12 */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .form-wrap {
      width: 100%;
      max-width: 400px;
    }

    .title-app {
      font-size: 2.5rem;
      font-weight: 300;
      color: #1a1a1a;
      margin-bottom: 40px;
      line-height: 1.2;
    }

    .title-form {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
    }

    /* Campos */
    .field {
      position: relative;
      margin-bottom: 16px;
    }

    .field label {
      position: absolute;
      top: -9px;
      left: 12px;
      background: #fff;
      padding: 0 4px;
      font-size: 0.75rem;
      color: rgba(0,0,0,0.6);
      pointer-events: none;
    }

    .field input {
      width: 100%;
      padding: 14px 14px;
      border: 1.5px solid rgba(0,0,0,0.23);
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
      color: #1a1a1a;
      background: #fff;
      outline: none;
      transition: border-color .2s;
    }

    .field input::placeholder { color: rgba(0,0,0,0.38); }
    .field input:focus { border-color: #2d5a27; }
    .field input:focus + label,
    .field:focus-within label { color: #2d5a27; }

    /* Botão */
    .btn-login {
      width: 100%;
      padding: 14px;
      background-color: #2d5a27;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
      transition: background .2s;
      letter-spacing: 0.02em;
    }

    .btn-login:hover { background-color: #3d7a35; }

    /* Rodapé */
    .footer-text {
      text-align: center;
      font-size: 0.875rem;
      color: rgba(0,0,0,0.6);
    }

    .footer-text a {
      color: #2d5a27;
      font-weight: 600;
      text-decoration: none;
    }

    .footer-text a:hover { text-decoration: underline; }

    .right {
      flex: 1;
      min-height: 100vh;
      background: linear-gradient(145deg, #2d5a27 0%, #3d7a35 50%, #4e9444 100%);
      background-image: url('terradaesperanca.jpeg');
      background-size: cover;
      background-position: center;
    }


  </style>
</head>
<body>

  
  <div class="left">
    <div class="form-wrap">

      <h1 class="title-app">Terra da Esperança</h1>

      <h2 class="title-form">Por favor, realize seu Login.</h2>

      <div class="field">
        <input type="email" id="email" placeholder="Coloque seu Email" />
        <label for="email">Email</label>
      </div>

      <div class="field">
        <input type="password" id="password" placeholder="Coloque sua Senha" />
        <label for="password">Senha</label>
      </div>

      <button class="btn-login" onclick="handleSignup()">Signup</button>

      <p class="footer-text">
        Não possui conta?
        <a href="cadastro.html">Cadastrar-se</a>
      </p>

    </div>
  </div>


  <div class="right"></div>

  <script>
    function handleSignup() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      console.log('Login:', email, password);
    }
  </script>

</body>
</html>
